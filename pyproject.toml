[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agenteval-debugger"
version = "0.1.0"
description = "面向学习者的 AI Agent 执行调试器"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Xhan-985" },
]
keywords = ["ai-agent", "debugger", "langgraph", "tracing", "observability"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Debuggers",
]
dependencies = [
    "langchain-core>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]
examples = [
    "langgraph>=1.0",
    "langchain-openai>=1.0",
]

web = [
    "streamlit>=1.30",
]

[project.urls]
Homepage = "https://github.com/Xhan-985/agent-eval-platform"
Repository = "https://github.com/Xhan-985/agent-eval-platform"
Issues = "https://github.com/Xhan-985/agent-eval-platform/issues"

[project.scripts]
agenteval-web = "agenteval.cli:web"

[tool.hatch.build.targets.wheel]
packages = ["agenteval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
tmp_path_retention_policy = "none"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.coverage.run]
source = ["agenteval"]
omit = ["tests/*"]
